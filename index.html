
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>주식회사 한통</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: sans-serif; }

    header {
      background-color: #ffffff;
      padding: 16px;
      font-size: 24px;
      font-weight: bold;
      text-align: left;
      padding-left: 20px;
      border-bottom: 1px solid #ddd;
    }

    .gnb {
      display: flex;
      justify-content: center;
      gap: 40px;
      background-color: #f9f9f9;
      border-bottom: 1px solid #ccc;
      padding: 10px 0;
    }

    .gnb button {
      background: none;
      border: none;
      font-size: 16px;
      cursor: pointer;
    }

    .gnb button:hover {
      color: #004aad;
    }

    .hero {
      width: 100%;
      display: flex;
      justify-content: center;
      background-color: #000;
    }

    .hero img {
      width: 100%;
      max-width: 1200px;
      height: auto;
    }

    .brand-section {
      overflow: hidden;
      background-color: #f0f0f0;
      padding: 20px 0;
    }

    .brand-row {
      display: flex;
      gap: 40px;
      animation: move-left 20s linear infinite;
    }

    .brand-row.bottom {
      animation: move-right 20s linear infinite;
    }

    .brand-row img {
      height: 80px;
      width: auto;
    }

    @keyframes move-left {
      0% { transform: translateX(0); }
      100% { transform: translateX(-50%); }
    }

    @keyframes move-right {
      0% { transform: translateX(0); }
      100% { transform: translateX(50%); }
    }

    footer {
      background-color: #1a1a1a;
      color: white;
      text-align: center;
      padding: 20px 0;
      font-size: 14px;
    }
  </style>
</head>
<body>

<header>주식회사 한통</header>

<div class="gnb">
  <button onclick="alert('아직 준비중인데용?')">회사소개</button>
  <button onclick="alert('아직 준비중인데용?')">서빙로봇</button>
  <button onclick="alert('아직 준비중인데용?')">하이오더</button>
  <button onclick="alert('아직 준비중인데용?')">결합할인</button>
  <button onclick="alert('아직 준비중인데용?')">이벤트</button>
</div>

<div class="hero">
  <img src="2. 메인 비주얼 이미지.png" alt="메인 비주얼 이미지" />
</div>

<section class="brand-section">
  <div class="brand-row">
    <img src="3. 체휴업체이미지1.png" alt="제휴업체" /><img src="3. 체휴업체이미지2.png" alt="제휴업체" /><img src="3. 체휴업체이미지1.png" alt="제휴업체" /><img src="3. 체휴업체이미지2.png" alt="제휴업체" /><img src="3. 체휴업체이미지1.png" alt="제휴업체" /><img src="3. 체휴업체이미지2.png" alt="제휴업체" />
  </div>
</section>

<section class="brand-section">
  <div class="brand-row bottom">
    <img src="3. 체휴업체이미지2.png" alt="제휴업체" /><img src="3. 체휴업체이미지1.png" alt="제휴업체" /><img src="3. 체휴업체이미지2.png" alt="제휴업체" /><img src="3. 체휴업체이미지1.png" alt="제휴업체" /><img src="3. 체휴업체이미지2.png" alt="제휴업체" /><img src="3. 체휴업체이미지1.png" alt="제휴업체" />
  </div>
</section>

<footer>
  주식회사 한통 | Copyright © 주식회사 한통. All rights reserved.
</footer>

</body>
</html>
